spring.application.name=retail-stock-inventory-system

# Default local database: use H2 so the app runs without a local MySQL password.
# To use MySQL instead, set the datasource properties below and comment these H2 lines.
spring.datasource.url=jdbc:h2:mem:retail_stock_db;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Uncomment the MySQL configuration below if you prefer to use MySQL locally.
# spring.datasource.url=jdbc:mysql://localhost:3306/retail_stock_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080
